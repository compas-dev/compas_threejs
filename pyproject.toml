[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "compas_threejs"
version = "0.1.0"
description = "A lightweight Three.js viewer for COMPAS using Protobuf"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "Eric Gozzi", email = "eric.gozzi@arch.ethz.ch" },
  { name = "Nicolas Benjamin Boscoboinik", email = "boscoboinik@arch.ethz.ch" }
]
keywords = ["compas", "viewer", "threejs", "protobuf"]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "compas",
    "compas-pb>=1,<2",
    "compas_brep[occ]",
    "websockets",
    "fastapi",
    "uvicorn",
    "rich",
]

[project.optional-dependencies]
dev = [
    "invoke",
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings",
    "mkdocstrings-python",
    "compas_invocations2[mkdocs]>=1.0.2",
    "ruff",
    "pytest>=8.4.2",
]

[project.urls]
Homepage = "https://github.com/compas-dev/compas_threejs"
Source = "https://github.com/compas-dev/compas_threejs"
Issues = "https://github.com/compas-dev/compas_threejs/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]

# -- DISCOVERY --
# Tells setuptools that the code is inside the 'src' folder
[tool.setuptools.packages.find]
where = ["src"]

# -- STATIC FILES --
# Critical: Tells setuptools to look at MANIFEST.in for non-python files (html, js)
[tool.setuptools]
include-package-data = true
